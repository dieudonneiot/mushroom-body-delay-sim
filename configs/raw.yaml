# Mushroom Body simulation config for the real Codex export in data/raw/.
# Same as default.yaml except data.mode and roles, which use the real
# FlyWire/Codex classification labels (ALPN/Kenyon_Cell/MBON) instead of the
# fixture's simplified PN/KC/MBON.
data:
  mode: raw
  raw_dir: data/raw
  fixture_dir: data/fixtures

roles:
  input: [ALPN]
  relay: [Kenyon_Cell]
  output: [MBON]

simulation:
  conduction_velocity: 1.0
  threshold: 1.0

damage:
  # Stack any of tau/amyloid (conduction-velocity channel) or gaba/apl
  # (firing-threshold channel) — same mechanism split as the Streamlit app's
  # "+ Add Perturbation" panel. Empty list = healthy baseline. See
  # mbsim/perturbations.py and mbsim/damage.py for the placeholder curves
  # these intensities feed into, pending the medical team's literature values.
  perturbations:
    - {type: tau, intensity: 30.0}

output:
  dir: outputs
